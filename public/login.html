<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - CollabBoard</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="auth-container">
    <div class="glass-panel auth-card">
      <div class="auth-header">
        <a href="/" class="logo-brand" style="justify-content: center; margin-bottom: 12px;">
          <i class="fa-solid fa-pen-ruler"></i> CollabBoard
        </a>
        <h1>Welcome Back</h1>
        <p>Sign in to continue to your collaborative boards</p>
      </div>

      <div id="alert-box" class="alert alert-error"></div>

      <form id="login-form">
        <div class="form-group">
          <label for="email"><i class="fa-solid fa-envelope"></i> Email Address</label>
          <input type="email" id="email" class="form-control" placeholder="user@example.com" required>
        </div>

        <div class="form-group">
          <label for="password"><i class="fa-solid fa-lock"></i> Password</label>
          <input type="password" id="password" class="form-control" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 8px;">
          <i class="fa-solid fa-right-to-bracket"></i> Sign In
        </button>
      </form>

      <p style="text-align: center; margin-top: 20px; font-size: 0.875rem; color: var(--text-secondary);">
        Don't have an account? <a href="/register.html">Register here</a>
      </p>
    </div>
  </div>

  <script src="/js/auth.js"></script>
  <script>
    if (Auth.isLoggedIn()) {
      window.location.href = '/dashboard.html';
    }

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const alertBox = document.getElementById('alert-box');
      alertBox.style.display = 'none';

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      try {
        await Auth.login(email, password);
        window.location.href = '/dashboard.html';
      } catch (err) {
        alertBox.textContent = err.message || 'Login failed.';
        alertBox.style.display = 'block';
      }
    });
  </script>
</body>
</html>
